#######################################
# 抖音收藏夹下载器 - 配置示例
# 使用方法: cp config.example.yml config.yml
# 然后填入 Cookie，运行 download_collects.py
#######################################

# 下载保存目录
path: ./Downloaded/collects/

# 下载选项
music: true
cover: true
avatar: false
json: true
folderstyle: true
thread: 5

# 单条视频最大时长（秒），默认 3600（1 小时）
max_duration_sec: 3600

# 下载数量限制（0 表示全部）
number:
  folders: 0
  videos: 0

# Cookie 配置（二选一，收藏夹下载必填）

# 方式 1：键值对（推荐）
cookies:
  sessionid: YOUR_SESSIONID
  ttwid: YOUR_TTWID
  msToken: YOUR_MSTOKEN
  odin_tt: YOUR_ODIN_TT

# 方式 2：整串 Cookie 字符串（使用时请注释掉上面的 cookies 块）
# cookie: "sessionid=xxx; ttwid=xxx; msToken=xxx; odin_tt=xxx;"
